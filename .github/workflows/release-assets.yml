name: Publish Android release assets

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example v2.2.5
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-assets:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Restore release signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing RELEASE_KEY_PASSWORD"; exit 1; }

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
          {
            printf 'release.storeFile=%s\n' "$RUNNER_TEMP/release-keystore.jks"
            printf 'release.storePassword=%s\n' "$STORE_PASSWORD"
            printf 'release.keyAlias=%s\n' "$KEY_ALIAS"
            printf 'release.keyPassword=%s\n' "$KEY_PASSWORD"
          } > local.properties

      - name: Build unsigned APK for F-Droid
        run: ./gradlew clean :app:assembleRelease --no-daemon -PfdroidUnsigned=true -PwarningsAsErrors=true

      - name: Build signed AAB for Google Play
        run: ./gradlew :app:bundleRelease --no-daemon -PwarningsAsErrors=true

      - name: Sign APK with preserved alignment
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          VERSION="${RELEASE_TAG#v}"
          "$APK_SIGNER" sign \
            --ks "$RUNNER_TEMP/release-keystore.jks" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --alignment-preserved \
            --out "Droidrops-${VERSION}-release.apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify signatures
        run: |
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APK_SIGNER"
          VERSION="${RELEASE_TAG#v}"
          "$APK_SIGNER" verify --verbose "Droidrops-${VERSION}-release.apk"
          # AAB files contain nested base modules; jarsigner reports their
          # JarFile/JarInputStream difference as a warning under -strict.
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Prepare release assets
        run: |
          VERSION="${RELEASE_TAG#v}"
          cp app/build/outputs/bundle/release/app-release.aab "Droidrops-${VERSION}-release.aab"
          sha256sum "Droidrops-${VERSION}-release.apk" "Droidrops-${VERSION}-release.aab"

      - name: Upload assets to GitHub release
        run: |
          VERSION="${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" \
            "Droidrops-${VERSION}-release.apk" \
            "Droidrops-${VERSION}-release.aab" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Droidrops-${{ env.RELEASE_TAG }}-android-assets
          path: |
            Droidrops-*-release.apk
            Droidrops-*-release.aab

      - name: Remove signing material
        if: always()
        run: rm -f local.properties "$RUNNER_TEMP/release-keystore.jks"
